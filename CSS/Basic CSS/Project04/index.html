<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body><center>

    <h1>
        Form with fieldset
    </h1>

    <form method="post">
        <fieldset>
           <legend>Login Details</legend>
           <table>
            <tr>
                <td><label for="username">Username</label></td>
                <td> <input type="text" name="username" id="username"></td>
            </tr>
            <tr>
                <td><label for="password">password</label></td>
                <td><input type="text" name="password" id="password"></td>
            </tr>
            <tr>
                <td><label for="Email">Email</label></td>
                <td> <input type="text" name="Email" id="Email"></td>
                
            </tr>
           </table>

         
        </fieldset>

        <fieldset>
            <legend>Education Details</legend>

             <table>
            <tr>
                <td><label for="Qualification">Qualification</label></td>
                <td> <input type="text" name="Qualification" id="Qualification"></td>
            </tr>
            <tr>
                <td><label for="Collage name ">Collage name</label></td>
                <td><input type="text" name="Collage Name" id="Collage name"></td>
                
            </tr>
            <tr>
                <td><label for="Graduation">Graduation</label></td>
                <td> <input type="text" name="Graduation" id="Graduation"></td>
                
            </tr>
           </table>

           
            
        </fieldset><br>
         <br>
        <p>
            <button>Submit</button>
        </p>
    </form></center>
</body>
</html>
