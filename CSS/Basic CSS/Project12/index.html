
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Neon Login - MARS TECH</title>
    <!-- Custom Style Sheet Link -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="ring">
  <div class="card">
    <h1>WELCOME</h1>
    <p class="sub">Login to your account</p>
    
    <div class="field">
      <input id="email" type="email" placeholder=" " autocomplete="email">
      <label for="email">Email Address</label>
    </div>
    
    <div class="field">
      <input id="pw" type="password" placeholder=" " autocomplete="current-password">
      <label for="pw">Password</label>
      <button class="eye" id="eye" type="button" aria-label="Show password">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
    
    <div class="row">
      <label><input type="checkbox"> Remember me</label>
      <a href="#">Forgot?</a>
    </div>
    
    <button class="btn" id="go" type="button">LOGIN</button>
    
    <div class="msg" id="msg" role="status"></div>
    <div class="foot">Don't have an account? <a href="#">Sign Up</a></div>
  </div>
</div>

<!-- Custom Javascript Link -->
<script src="script.js"></script>
</body>
</html>
