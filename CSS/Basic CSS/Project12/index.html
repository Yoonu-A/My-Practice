    <h5>Sum Calculation</h5>
<input id="num1"> 
<input id="num2">
<button onclick="answer()">Add</button>
<p id="result">Result</p> <br>






<script>
    let box1 = document.getElementById("num1");
    let box2 = document.getElementById("num2");
    let result = document.getElementById("result");
    let button = document.querySelector("button");

    button.addEventListener("click", function() {
        let num1 = Number(box1.value);
        let num2 = Number(box2.value);
        let sum = num1 + num2;
        result.textContent = "Result: " + sum;
    });
</script>
