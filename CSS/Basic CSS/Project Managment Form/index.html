<!DOCTYPE html>
<html>
    <head>
        <title>CSS Ticks</title>
        <style >
            .box
            {
                width: 100px;
                height: 100px;
                background-color: aqua;
                
                margin-top: 15%;
                margin-left: 45%;

                animation :mt 2s linear  infinite alternate;
            }

            @keyframes mt
            {
                0%
                {
                    
                    border-radius: 0%;
                }
                25%
                {
                    
                    border-radius: 25%;
                    background-color: aquamarine;
                    transform: scale(1.2);
                    width: 150px;
                    height: 150px;
                }
        
                100%
                {
                    
                    border-radius: 50%;
                    background-color: rgb(10, 135, 212);
                    transform: scale(1.5);
                    width: 300px;
                    height: 300px;

                }
            }

            
        </style>
        
            
       
    </head>
    <body>
        <div class="box"> 
            
        </div>

    </body>
</html>
