<html>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cake Shop</title>
        <link  rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div>
        <h1>Order Now</h1>
        <form  action="" >
            
                <select name="cake" id="cake">
                    <option value="angel">Angel food cake</option>
                    <option value="chocolate">Chocolate cake</option>
                    <option value="fudge">Chocolate fudge cake</option>
                    <option value="lava">Chocolate lava cake</option>
                </select> <br> <br>
                
            

            
                <input type="text"  placeholder="NAME" id="text"><br><br>
           
            
                    <input type="numbers" name="name" placeholder="PHONE NUMBER"  id="name"><br><br>
            
            
            <textarea name="address" placeholder="ADDRESS" id="address" cols="20" rows="5"></textarea><br><br>
            
                
                </form>

                <button type="submit">ORDER NOW</button>
</div>    </body>
</html>
